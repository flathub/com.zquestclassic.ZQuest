app-id: com.zquestclassic.ZQuest
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
finish-args:
  - --share=network
  - --share=ipc
  # Allegro only has an X11 backend (no native Wayland), so runs via XWayland.
  # Do not use wayland + fallback-x11: that hides X11 on Wayland sessions and crashes.
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Needed for game controllers.
  - --device=all
command: entry.sh
cleanup:
  - /bin/*png*

modules:
  - name: zquest
    buildsystem: cmake
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      # Fixes build errors w/ clang21+ and fmt
      cxxflags: "-DFMT_CONSTEVAL="
    config-opts:
      - -D CMAKE_POLICY_VERSION_MINIMUM=3.5
      - -D CMAKE_C_COMPILER=clang
      - -D CMAKE_CXX_COMPILER=clang++
      # - -D ZC_OFFICIAL=1
      # - -D ZC_VERSION=2.55.13
      - -D RELEASE_TAG=2.55.18
      - -D RELEASE_CHANNEL=2.55
      - -D REPO=ZQuestClassic/ZQuestClassic
      - -D FETCHCONTENT_SOURCE_DIR_SDL2=../deps/sdl2
      - -D FETCHCONTENT_SOURCE_DIR_ALLEGRO5=../deps/allegro5
      - -D FETCHCONTENT_SOURCE_DIR_GME_EXTERNAL=../deps/gme
      # - -D FETCHCONTENT_SOURCE_DIR_ASIO=../deps/asio
      # - -D FETCHCONTENT_SOURCE_DIR_WEBSOCKETPP=../deps/websocketpp
      - -D FETCHCONTENT_SOURCE_DIR_ASMJIT=../deps/asmjit
      - -D FETCHCONTENT_SOURCE_DIR_NATIVEFILEDIALOG=../deps/nfd
      - -D FETCHCONTENT_SOURCE_DIR_JSON=../deps/json
      - -D FETCHCONTENT_SOURCE_DIR_STDUUID=../deps/stduuid
      - -D FETCHCONTENT_SOURCE_DIR_MINIZ=../deps/miniz
      - -D WANT_VENDORED_ZLIB=OFF
      # TODO: for some reason `find_package(PNG REQUIRED)` is not producing PNG::PNG target.
      # - -D WANT_VENDORED_LIBPNG=OFF
    sources:
      - type: git
        url: https://github.com/ZQuestClassic/ZQuestClassic
        commit: a040a2b14dc23012234f0abc0e5f225a0921e9d7
        tag: 2.55.18
        # TODO: can remove when changelog for latest version is not generated at release time (which needs commit history)
        disable-shallow-clone: true
      - type: git
        url: https://github.com/libsdl-org/SDL
        commit: 5d249570393f7a37e037abf22cd6012a4cc56a71
        tag: release-2.32.10
        dest: deps/sdl2
      - type: git
        url: https://github.com/connorjclark/allegro5
        tag: 9780b84a313d459baaf79f7cc493f6f975ac50f9
        dest: deps/allegro5
      - type: git
        url: https://github.com/libgme/game-music-emu
        tag: 8238afd9503a59ffcec0e2685584d5ce819ad7c6
        dest: deps/gme
      # - type: git
      #   url: https://github.com/chriskohlhoff/asio
      #   tag: ed5db1b50136bace796062c1a6eab0df9a74f8fa
      #   dest: deps/asio
      # - type: git
      #   url: https://github.com/zaphoyd/websocketpp
      #   tag: b9aeec6eaf3d5610503439b4fae3581d9aff08e8
      #   dest: deps/websocketpp
      - type: git
        url: https://github.com/connorjclark/asmjit
        tag: 6d153ad8e13984841c2c642c0fa11e60f41e54dc
        dest: deps/asmjit
      - type: git
        url: https://github.com/btzy/nativefiledialog-extended
        tag: 660493307dd6a8d7fe5fa77cb1c23cbb18ff17c3
        dest: deps/nfd
      - type: git
        url: https://github.com/mariusbancila/stduuid
        tag: 3afe7193facd5d674de709fccc44d5055e144d7a
        dest: deps/stduuid
      - type: git
        url: https://github.com/richgel999/miniz
        tag: 9ae305f6e109f8f1fbd2130458f1ee6197269b3b
        dest: deps/miniz
      - type: shell
        commands:
          - cd deps/stduuid && git apply ../../third_party/stduuid.patch
          - cd deps/gme && git apply ../../third_party/gme.patch
          - cd deps/sdl2 && git apply ../../third_party/sdl2.patch
      - type: archive
        url: https://github.com/nlohmann/json/releases/download/v3.11.3/json.tar.xz
        sha256: d6c65aca6b1ed68e7a182f4757257b107ae403032760ed6ef121c9d55e81757d
        dest: deps/json

  - name: files
    buildsystem: simple
    build-commands:
      - |
        set -ex
        install -Dm 644 -t /app/share/applications com.zquestclassic.ZQuest.desktop
        install -Dm 644 -t /app/share/applications com.zquestclassic.ZQuest.Player.desktop
        install -Dm 644 -t /app/share/applications com.zquestclassic.ZQuest.Editor.desktop
        install -Dm 644 -t /app/share/metainfo com.zquestclassic.ZQuest.metainfo.xml
        install -Dm 644 -t /app/share/mime/packages com.zquestclassic.ZQuest.xml

        for s in {16,32,64,128,192,256,512}; do
          install -p -Dm644 com.zquestclassic.ZQuest-$s.png /app/share/icons/hicolor/${s}x${s}/apps/com.zquestclassic.ZQuest.png
          rm com.zquestclassic.ZQuest-$s.png
        done

        for app in Player Editor; do
          for s in {16,32,48,128,256}; do
            install -p -Dm644 com.zquestclassic.ZQuest.$app-$s.png /app/share/icons/hicolor/${s}x${s}/apps/com.zquestclassic.ZQuest.$app.png
            rm com.zquestclassic.ZQuest.$app-$s.png
          done
        done

        mv entry.sh /app/bin

    sources:
      - type: script
        dest-filename: entry.sh
        commands:
          # Usage: entry.sh [zlauncher|zplayer|zeditor] [args...]
          # Runs the launcher by default. Remaining args are passed to the program.
          - |
            set -e
            PROGRAM=zlauncher
            case "$1" in
              zlauncher|zplayer|zeditor) PROGRAM="$1"; shift ;;
            esac

            # Make relative file paths absolute, since we cd to the data dir below.
            for arg do
              shift
              case "$arg" in
                -*|/*) ;;
                *) if [ -e "$arg" ]; then arg="$PWD/$arg"; fi ;;
              esac
              set -- "$@" "$arg"
            done

            # Opening a quest file in the player (e.g. double-clicking a .qst)
            # plays it in standalone mode.
            if [ "$PROGRAM" = zplayer ] && [ $# -eq 1 ]; then
              case "$1" in
                *.qst) set -- -standalone "$1" ;;
              esac
            fi

          # Copy all app resources to user's data directory, and execute
          # the program from there.
          - |
            DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/ZQuest Classic"
            mkdir -p "$DATA_DIR"
            echo "Using data directory: $DATA_DIR"

            # Remove old symlinks from previous implementation.
            find "$DATA_DIR" -maxdepth 1 -type l -not -path "$DATA_DIR/bin" | while read f; do
              echo readlink "$f"
              if readlink "$f" | grep -q /app; then
                mkdir -p "$DATA_DIR/old_links_can_delete_folder"
                mv "$f" "$DATA_DIR/old_links_can_delete_folder"
              fi
            done

            # Recursively copy all contents of the app resources dir to the user's data dir.
            cp -rup "/app/share/zquestclassic/"* "$DATA_DIR/"

          # nvidia cards are not working within flatpak, at least for me
          # on Linux Mint 21.3. So set LIBGL_ALWAYS_SOFTWARE to workaround.
          # See https://github.com/alemart/opensurge/issues/116
          - |
            cd "$DATA_DIR"
            if lspci | grep VGA | grep NVIDIA; then
              echo "-----------------------"
              echo "NVIDIA card detected - if no window opens, be sure you are using the official"
              echo "drivers from NVIDIA - use the Driver Manager https://itsfoss.com/nvidia-linux-mint/ (Linux Mint) or the"
              echo "equivalent for your operating system."
              echo
              echo "As a last resort, set the LIBGL_ALWAYS_SOFTWARE=1 environment variable (will result in high CPU)"
              echo "-----------------------"
              # export LIBGL_ALWAYS_SOFTWARE=1
            fi
            ZC_DISABLE_CHDIR=1 exec "$PROGRAM" "$@"
      - type: file
        path: com.zquestclassic.ZQuest.metainfo.xml
      - type: file
        path: com.zquestclassic.ZQuest.desktop
      - type: file
        path: com.zquestclassic.ZQuest.Player.desktop
      - type: file
        path: com.zquestclassic.ZQuest.Editor.desktop
      - type: file
        path: com.zquestclassic.ZQuest.xml
      - type: file
        path: icons/com.zquestclassic.ZQuest-16.png
      - type: file
        path: icons/com.zquestclassic.ZQuest-32.png
      - type: file
        path: icons/com.zquestclassic.ZQuest-64.png
      - type: file
        path: icons/com.zquestclassic.ZQuest-128.png
      - type: file
        path: icons/com.zquestclassic.ZQuest-192.png
      - type: file
        path: icons/com.zquestclassic.ZQuest-256.png
      - type: file
        path: icons/com.zquestclassic.ZQuest-512.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Player-16.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Player-32.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Player-48.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Player-128.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Player-256.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Editor-16.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Editor-32.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Editor-48.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Editor-128.png
      - type: file
        path: icons/com.zquestclassic.ZQuest.Editor-256.png
